<script>
// VAJB version.js 1.1 - "Verzija" u Podešavanjima + traka „Nova verzija“ (PRAVILA.md V1, V2, V3). Based on PDFactory.
// Needs base.css + dialog.js. Server: GET /api/update (update.status / selfupdate.check), POST /api/update
// (update.apply / selfupdate.apply), GET /health -> {pid, version}, GET /api/settings -> {version: "<App> X.Y.Z · hash"}.
//
//   vv.init({ storeKey: "mojaapp", beforeUpdate: async () => true, labels: {...} });   // once at start
//   vv.section(container, settings.version)   // row: "<App> X.Y.Z · hash" + under it the state of the last check
//                                             // („Najnovija verzija · provereno 14:40“ / „Nova verzija X“) + one button
//   vv.startChecks(barsElement)               // check at start and every hour -> bar „Nova verzija X“ + Ažuriraj
//
// Every check (start, hourly, by hand) is remembered and shown in the section. Button: „Proveri“, or „Ažuriraj na X“
// when a newer version is known; one click checks and, if newer (or code on disk newer than the running server),
// updates + restarts at once. After the reload a toast says „Ažurirano: X.Y.Z“.
// beforeUpdate: save the workspace / ask about unsaved changes; return false to cancel.
(function () {
  const L = {
    check: "Proveri", updateTo: (v) => `Ažuriraj na ${v}`, latest: "Najnovija verzija", failed: "Provera nije uspela",
    checking: "Provera…", checked: (t) => `provereno ${t}`,
    updating: (v) => `Ažuriranje na ${v}…`, newVersion: (v) => `Nova verzija ${v}`, update: "Ažuriraj",
    updated: (v) => `Ažurirano: ${v}`, theNew: "novu verziju",
  };
  let opt = { storeKey: "app", beforeUpdate: async () => true };
  let pid = null;
  let last = null;                        // {r, at} of the last check
  const isNew = (r) => r && r.ok && (r.behind || r.restart);
  const hhmm = (d) => d.toLocaleTimeString("sr-RS", { hour: "2-digit", minute: "2-digit" });
  async function check() {
    const r = await getJSON("/api/update").catch(() => ({ ok: false }));
    last = { r, at: new Date() };
    return r;
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const getJSON = (u) => fetch(u).then((r) => r.json());

  function toast(text) {
    const t = document.createElement("div"); t.className = "vv-toast"; t.textContent = text;
    document.body.appendChild(t); setTimeout(() => t.remove(), 4000);
  }

  async function init(o = {}) {
    opt = { ...opt, ...o }; Object.assign(L, o.labels || {});
    try { pid = (await getJSON("/health")).pid; } catch (e) { /* server not up yet */ }
    const key = opt.storeKey + ".upd";
    try {
      if (localStorage.getItem(key) !== null) {
        localStorage.removeItem(key);
        const h = await getJSON("/health"); toast(L.updated(h.version));
      }
    } catch (e) { /* no storage */ }
  }

  async function waitRestart() {
    for (let i = 0; i < 90; i++) {
      await new Promise((r) => setTimeout(r, 1000));
      try { const h = await getJSON("/health"); if (h.pid !== pid) { location.reload(); return; } } catch (e) { /* restarting */ }
    }
  }

  async function doUpdate(r) {
    if (!(await opt.beforeUpdate())) return false;
    try { localStorage.setItem(opt.storeKey + ".upd", r.version || ""); } catch (e) { /* no storage */ }
    const p = await fetch("/api/update", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
      .then((x) => x.json()).catch(() => null);
    if (p && p.ok) { setTimeout(waitRestart, 1500); return true; }
    try { localStorage.removeItem(opt.storeKey + ".upd"); } catch (e) { /* no storage */ }
    if (p && p.error && window.vd) vd.message(p.error);
    return false;
  }

  function section(container, label) {
    const row = document.createElement("div"); row.className = "vv-row";
    row.innerHTML = `<div class="vv-info"><span>${esc(label)}</span><span class="vv-st"></span></div><button type="button"></button>`;
    const st = row.querySelector(".vv-st"), b = row.querySelector("button");
    const paint = () => {
      if (!last) { st.innerHTML = `<span class="vv-muted">${esc(L.checking)}</span>`; b.textContent = L.check; return; }
      const r = last.r, n = isNew(r);
      st.innerHTML = !r.ok ? `<span class="vv-muted">${esc(L.failed)} · ${hhmm(last.at)}</span>`
        : n ? `<span class="vv-new">${esc(L.newVersion(r.version || ""))}</span>`
        : `<span class="vv-ok">${esc(L.latest)}</span><span class="vv-muted">· ${esc(L.checked(hhmm(last.at)))}</span>`;
      b.textContent = n ? L.updateTo(r.version || "") : L.check;
      b.classList.toggle("primary", !!n);
    };
    b.onclick = async () => {
      let r = last && last.r;
      if (!isNew(r)) { st.innerHTML = `<span class="vv-muted">${esc(L.checking)}</span>`; r = await check(); paint(); }
      if (isNew(r)) {
        b.disabled = true; st.innerHTML = `<span class="vv-ok">${esc(L.updating(r.version || L.theNew))}</span>`;
        if (!(await doUpdate(r))) { b.disabled = false; paint(); }
      }
    };
    container.appendChild(row);
    paint();
    if (!last || Date.now() - last.at > 3600 * 1000) check().then(() => row.isConnected && paint());
    return row;
  }

  function startChecks(bars) {
    const run = async () => {
      const r = await check();
      if (!isNew(r) || document.getElementById("vv-bar")) return;
      const el = document.createElement("div"); el.id = "vv-bar"; el.className = "vv-bar";
      el.innerHTML = `<span>${esc(L.newVersion(r.version || ""))}</span><button type="button" class="primary">${esc(L.update)}</button>`;
      el.querySelector("button").onclick = async () => {
        el.querySelector("span").textContent = L.updating(r.version || L.theNew);
        el.querySelector("button").remove();
        if (!(await doUpdate(r))) el.remove();
      };
      bars.appendChild(el);
    };
    run(); setInterval(run, 3600 * 1000);
  }

  window.vv = { init, section, startChecks, update: doUpdate };
})();


const $  = (s,k)=> (k||document).querySelector(s);
const $$ = (s,k)=> Array.from((k||document).querySelectorAll(s));
const ucini = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ogr = (v,a,b)=> Math.min(Math.max(v, a===undefined?0:a), b===undefined?1:b);
const ikona = n => '<svg class="ik"><use href="#'+n+'"/></svg>';

let PODACI=null, RED=[], TEKUCA=null, STAMPAC=null, KOREN_BIBL='';
let IZVOR=new Image(), IZVOR_ZA=null, PRSTEN=new Image(), PRSTEN_OK=false;
let PRIKAZI_POPUNU=false;
let tPrsten=null, tIzvor=null, tTabak=null, tCrtanje=null, cekaj=null;

const tekuca = ()=> RED.find(s=>s.id===TEKUCA) || null;

/* ============================================ poruke u stilu aplikacije */
function poruka(tekst, naslov){
  $('#poruka-naslov').textContent = naslov || 'Obaveštenje';
  $('#poruka-tekst').textContent = tekst;
  $('#dij-poruka').showModal();
}
$('#poruka-ok').onclick = ()=> $('#dij-poruka').close();

function potvrdi(tekst, naslov, dugme){
  return new Promise(res=>{
    const d=$('#dij-potvrda');
    $('#potvrda-naslov').textContent = naslov || 'Potvrda';
    $('#potvrda-tekst').textContent = tekst;
    $('#potvrda-da').textContent = dugme || 'Obriši';
    $('#potvrda-da').onclick=()=>{ d.close(); res(true); };
    $('#potvrda-ne').onclick=()=>{ d.close(); res(false); };
    d.showModal();
  });
}

function pitajNaziv(predlog){
  return new Promise(res=>{
    const d=$('#dij-naziv'), p=$('#naziv-polje');
    p.value=predlog||'';
    const ok=()=>{ d.close(); res(p.value.trim()||null); };
    const ne=()=>{ d.close(); res(null); };
    $('#naziv-ok').onclick=ok;
    $('#naziv-otkazi').onclick=ne;
    p.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } };
    d.showModal(); p.focus(); p.select();
  });
}

/* ============================================ učitavanje */
async function povuci(){
  PODACI = await (await fetch('/api/podaci')).json();
  document.documentElement.dataset.tema = PODACI.app.tema || 'svetla';
  const t = PODACI.podesavanja.tabak;
  $('#lenjir').checked = !!t.lenjir;
  $('#t-ivica').value = t.ivica;
  $('#t-razmak').value = t.razmak;
  RED = (PODACI.slike||[]).map(s=>({id:s.id, ime:s.ime, pod:s.pod, priprema:s.priprema}));
  if(!TEKUCA || !RED.some(s=>s.id===TEKUCA)) TEKUCA = RED.length ? RED[0].id : null;
  crtajRed();
  crtajPopune();
  osveziTabak();
}

/* ============================================ red */
function crtajRed(){
  const l=$('#red'); l.innerHTML='';
  $('#broj').textContent = RED.length || '';
  RED.forEach(s=>{
    const b=document.createElement('button');
    b.className='stavka'+(s.id===TEKUCA?' izabrana':'');
    b.innerHTML='<img src="/api/izvor/'+s.id+'?w=120" alt="">'
               +'<span>'+ucini(s.ime)+'</span>'
               +'<button class="x" aria-label="Ukloni">'+ikona('i-x')+'</button>';
    b.onclick=e=>{
      if(e.target.closest('.x')){ e.stopPropagation(); ukloni(s.id); return; }
      TEKUCA=s.id; crtajRed();
    };
    l.appendChild(b);
  });
  const t=tekuca();
  $('#ime-fajla').textContent = t ? t.ime : '—';
  $('#dugme-sacuvaj').disabled = !t;
  $('#dugme-stampaj').disabled = !RED.length;
  $('#prazno').hidden = !!t;
  $('#alatke').hidden = !t;
  if(t){ ucitajPod(); ucitajIzvor(); osveziPrsten(); }
  else { PRSTEN_OK=false; crtajPlatno(); }
}
async function ukloni(id){
  await fetch('/api/slika/'+id,{method:'DELETE'});
  RED=RED.filter(s=>s.id!==id);
  if(TEKUCA===id) TEKUCA = RED.length ? RED[0].id : null;
  crtajRed(); osveziPresete(); osveziTabak();
}

/* ============================================ biblioteka kao drvo */
async function sadrzaj(put){
  try { return await (await fetch('/api/pregledaj?put='+encodeURIComponent(put||''))).json(); }
  catch(e){ return {ok:false}; }
}
function granaZa(ime, put, nivo){
  const omot=document.createElement('div');
  const g=document.createElement('button');
  g.className='grana';
  g.innerHTML=ikona('i-strelica').replace('class="ik"','class="ik strelica"')
             + ikona('i-fascikla').replace('class="ik"','class="ik fas"')
             + '<b>'+ucini(ime)+'</b>';
  const deca=document.createElement('div');
  deca.className='deca'; deca.hidden=true;
  let ucitano=false;
  g.onclick=async ()=>{
    const otvara = deca.hidden;
    g.classList.toggle('otvorena', otvara);
    deca.hidden = !otvara;
    if(otvara && !ucitano){ ucitano=true; await napuniGranu(deca, put, nivo+1); }
  };
  omot.appendChild(g); omot.appendChild(deca);
  return {omot, deca, g};
}
async function napuniGranu(gde, put, nivo){
  const d=await sadrzaj(put);
  gde.innerHTML='';
  if(!d.ok) return;
  (d.fascikle||[]).forEach(f=>{
    const {omot}=granaZa(f.ime, f.put, nivo);
    gde.appendChild(omot);
  });
  (d.slike||[]).forEach(s=>{
    const b=document.createElement('button');
    b.className='list';
    b.innerHTML='<img src="/api/slicica?put='+encodeURIComponent(s.put)+'" alt="">'
               +'<span>'+ucini(s.ime)+'</span>';
    b.onclick=async ()=>{
      const r=await (await fetch('/api/otvori_iz_biblioteke',{method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify({put:s.put})})).json();
      if(!r.ok){ poruka(r.poruka||'Ne mogu da otvorim tu sliku.'); return; }
      await povuci(); TEKUCA=r.slika.id; crtajRed(); osveziPresete();
    };
    gde.appendChild(b);
  });
  if(!gde.children.length){
    const p=document.createElement('div');
    p.className='poruka'; p.style.padding='3px 6px'; p.textContent='prazno';
    gde.appendChild(p);
  }
}
async function crtajDrvo(){
  const d=await sadrzaj('');
  KOREN_BIBL = d.koren || '';
  const l=$('#drvo'); l.innerHTML='';
  const ime = (KOREN_BIBL.split(/[\\/]/).filter(Boolean).pop()) || 'Biblioteka';
  const {omot, deca, g} = granaZa(ime, '', 0);
  g.title = KOREN_BIBL;
  l.appendChild(omot);
  g.classList.add('otvorena'); deca.hidden=false;      // koren je uvek otvoren
  await napuniGranu(deca, '', 1);
}

/* ============================================ uvoz */
$('#dugme-uvezi').onclick = ()=> $('#fajlovi').click();
$('#fajlovi').onchange = e=>{ posaljiFajlove(e.target.files); e.target.value=''; };
async function posaljiFajlove(lista){
  if(!lista || !lista.length) return;
  const fd=new FormData();
  for(const f of lista) fd.append('fajl', f);
  const d=$('#dugme-uvezi'); d.disabled=true; d.textContent='Uvozim…';
  let r=null;
  try{ r=await (await fetch('/api/uvoz',{method:'POST',body:fd})).json(); }
  catch(err){ poruka('Uvoz nije uspeo: '+err); }
  d.disabled=false; d.textContent='Uvezi';
  if(!r) return;
  if(r.odbijene && r.odbijene.length)
    poruka('Ovo nisam uspeo da otvorim:\n'+r.odbijene.map(x=>'· '+x.ime).join('\n'));
  if(r.dodate && r.dodate.length){
    await povuci();
    TEKUCA=r.dodate[r.dodate.length-1].id;
    crtajRed(); osveziPresete();
  }
}
const scena=$('#scena');
['dragenter','dragover'].forEach(d=> scena.addEventListener(d, e=>{
  e.preventDefault(); scena.classList.add('pada'); }));
['dragleave','drop'].forEach(d=> scena.addEventListener(d, e=>{
  e.preventDefault(); if(d==='drop'||e.target===scena) scena.classList.remove('pada'); }));
scena.addEventListener('drop', e=>{
  e.preventDefault(); scena.classList.remove('pada');
  if(e.dataTransfer && e.dataTransfer.files.length) posaljiFajlove(e.dataTransfer.files);
});
window.addEventListener('dragover', e=>e.preventDefault());
window.addEventListener('drop', e=>e.preventDefault());

/* ============================================ editor */
const platno=$('#platno'), ctx=platno.getContext('2d');
const LENJIR=26;
let VID={x:0,y:0,w:0,h:0}, MM=1;

function kljucIzvora(t){
  return [t.pod.crna,t.pod.bela,t.pod.zasicenje,t.pod.jasnoca,t.pod.preset,
          t.pod.jacina_preseta,t.pod.obrezi_rub,t.pod.rotacija,t.pod.ogledalo].join(',');
}
function ucitajIzvor(){
  const t=tekuca(); if(!t) return;
  const url='/api/izvor/'+t.id+'?w=1100&v='+encodeURIComponent(kljucIzvora(t));
  if(IZVOR_ZA===url){ crtajPlatno(); return; }
  IZVOR_ZA=url;
  const im=new Image();
  im.onload=()=>{ if(IZVOR_ZA===url){ IZVOR=im; crtajPlatno(); } };
  im.src=url;
}
function osveziPrsten(){
  if(!PRIKAZI_POPUNU){ return; }
  clearTimeout(tPrsten);
  tPrsten=setTimeout(()=>{
    const t=tekuca(); if(!t) return;
    const im=new Image();
    im.onload=()=>{ PRSTEN=im; PRSTEN_OK=true; crtajPlatno(); };
    im.onerror=()=>{ PRSTEN_OK=false; };
    im.src='/api/pregled/'+t.id+'?dpi=70&t='+Date.now();
  }, 120);
}

function velicinaPlatna(){
  const s=scena.getBoundingClientRect();
  const dpr=Math.min(2, window.devicePixelRatio||1);
  const w=Math.max(120,Math.floor(s.width-20)), h=Math.max(120,Math.floor(s.height-20));
  platno.style.width=w+'px'; platno.style.height=h+'px';
  platno.width=Math.floor(w*dpr); platno.height=Math.floor(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {w,h};
}

function crtajPlatno(){
  const t=tekuca();
  const {w:SW,h:SH}=velicinaPlatna();
  ctx.clearRect(0,0,SW,SH);
  if(!t || !IZVOR.width || !PODACI) return;
  const r=PODACI.ram;

  // okvir je namerno manji od raspolozivog prostora, da slika oko njega dise
  const px=SW-LENJIR-24, py=SH-LENJIR-24;
  let pw=px*0.76, ph=pw*r.puna[1]/r.puna[0];
  if(ph>py*0.76){ ph=py*0.76; pw=ph*r.puna[0]/r.puna[1]; }
  const ox=LENJIR+(px-pw)/2+12, oy=LENJIR+(py-ph)/2+12;
  MM=pw/r.puna[0];
  VID={x:ox+(r.napust+r.preklop[0])*MM, y:oy+(r.napust+r.preklop[1])*MM,
       w:r.prozor[0]*MM, h:r.prozor[1]*MM};
  const rez={x:ox+r.napust*MM, y:oy+r.napust*MM, w:r.rez[0]*MM, h:r.rez[1]*MM};
  const puna={x:ox, y:oy, w:pw, h:ph};

  // 1) cela slika, i izvan okvira - da se vidi sta otpada
  const g=geom(t);
  ctx.save();
  ctx.beginPath(); ctx.rect(LENJIR,LENJIR,SW-LENJIR,SH-LENJIR); ctx.clip();
  if(g.zum<1){
    ctx.fillStyle=t.pod.boja_pozadine||'#FFFFFF';
    ctx.fillRect(VID.x,VID.y,VID.w,VID.h);
  }
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(IZVOR, g.x, g.y, g.nw, g.nh);

  // 2) kad se bira popuna, preko prstena ide stvaran otisak
  if(PRIKAZI_POPUNU && PRSTEN_OK && PRSTEN.width){
    ctx.save();
    ctx.beginPath();
    ctx.rect(puna.x,puna.y,puna.w,puna.h);
    ctx.rect(VID.x,VID.y,VID.w,VID.h);
    ctx.clip('evenodd');
    ctx.drawImage(PRSTEN, puna.x, puna.y, puna.w, puna.h);
    ctx.restore();
  }

  // 3) zatamnjenja - samo preko slike i okvira, prazna scena ostaje svetla
  const ux=Math.min(g.x,puna.x), uy=Math.min(g.y,puna.y);
  const ux2=Math.max(g.x+g.nw,puna.x+puna.w), uy2=Math.max(g.y+g.nh,puna.y+puna.h);
  ctx.fillStyle='rgba(18,16,13,.5)';
  prsten(ux,uy,ux2-ux,uy2-uy, rez.x,rez.y,rez.w,rez.h);
  ctx.fillStyle='rgba(18,16,13,.26)';
  prsten(rez.x,rez.y,rez.w,rez.h, VID.x,VID.y,VID.w,VID.h);
  ctx.restore();

  // 4) linije
  ctx.lineWidth=1; ctx.setLineDash([5,4]); ctx.strokeStyle='rgba(255,253,248,.62)';
  ctx.strokeRect(rez.x+.5, rez.y+.5, rez.w-1, rez.h-1);
  ctx.setLineDash([]); ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,253,248,.95)';
  ctx.strokeRect(VID.x+.5, VID.y+.5, VID.w-1, VID.h-1);

  crtajLenjire(SW,SH,rez);
}

function geom(t){
  // identicno obrada.smesti(): skala koja pokriva prozor, pomnozena zumom
  const W=IZVOR.width, H=IZVOR.height;
  const zum=Math.max(0.05, t.pod.zum||1);
  const s=Math.max(VID.w/W, VID.h/H)*zum;
  const nw=W*s, nh=H*s;
  return {W,H,zum,nw,nh,
          x: VID.x+(VID.w-nw)*ogr(t.pod.pomak_x),
          y: VID.y+(VID.h-nh)*ogr(t.pod.pomak_y)};
}
function prsten(X,Y,W,H, x,y,w,h){
  ctx.beginPath(); ctx.rect(X,Y,W,H); ctx.rect(x,y,w,h); ctx.fill('evenodd');
}

/* --- lenjir u stilu Worda: traka, sitne crtice, retki brojevi --- */
function crtajLenjire(SW,SH,rez){
  const r=PODACI.ram, st=getComputedStyle(document.documentElement);
  const traka=st.getPropertyValue('--traka').trim();
  const ivica=st.getPropertyValue('--ivica').trim();
  const boja=st.getPropertyValue('--prigusen').trim();
  const nag=st.getPropertyValue('--naglasak').trim();
  const poz=st.getPropertyValue('--scena').trim();

  ctx.fillStyle=poz; ctx.fillRect(0,0,SW,LENJIR); ctx.fillRect(0,0,LENJIR,SH);
  // traka pokriva samo raspon otiska, kao margina u Wordu
  ctx.fillStyle=traka;
  ctx.fillRect(rez.x, 4, rez.w, LENJIR-9);
  ctx.fillRect(4, rez.y, LENJIR-9, rez.h);
  ctx.strokeStyle=ivica; ctx.lineWidth=1;
  ctx.strokeRect(rez.x+.5, 4.5, rez.w-1, LENJIR-10);
  ctx.strokeRect(4.5, rez.y+.5, LENJIR-10, rez.h-1);
  // raspon prozora je naglasen
  ctx.fillStyle=color_mix(nag, .34);
  ctx.fillRect(VID.x, 4, VID.w, LENJIR-9);
  ctx.fillRect(4, VID.y, LENJIR-9, VID.h);

  ctx.strokeStyle=boja; ctx.fillStyle=boja;
  ctx.font='9px ui-sans-serif,-apple-system,Segoe UI,sans-serif';
  const korak = MM*5>9 ? 5 : 10;
  const dno=LENJIR-5;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let mm=0; mm<=r.rez[0]+0.01; mm+=korak){
    const x=Math.round(rez.x+mm*MM)+.5;
    if(mm%10===0 && MM*10>20){ ctx.fillText(String(mm), x, LENJIR/2-.5); }
    else { ctx.beginPath(); ctx.moveTo(x,dno); ctx.lineTo(x,dno-3); ctx.stroke(); }
  }
  for(let mm=0; mm<=r.rez[1]+0.01; mm+=korak){
    const y=Math.round(rez.y+mm*MM)+.5;
    if(mm%10===0 && MM*10>20){
      ctx.save(); ctx.translate(LENJIR/2-.5,y); ctx.rotate(-Math.PI/2);
      ctx.fillText(String(mm),0,0); ctx.restore();
    } else { ctx.beginPath(); ctx.moveTo(dno,y); ctx.lineTo(dno-3,y); ctx.stroke(); }
  }
}
function color_mix(boja, alfa){
  const m=boja.trim();
  if(m.startsWith('#')){
    const n=m.length===4 ? m.replace(/#(.)(.)(.)/,'#$1$1$2$2$3$3') : m;
    const v=parseInt(n.slice(1),16);
    return 'rgba('+((v>>16)&255)+','+((v>>8)&255)+','+(v&255)+','+alfa+')';
  }
  return m;
}

/* --- vuci i zumiraj --- */
let vuce=null;
platno.addEventListener('pointerdown', e=>{
  const t=tekuca(); if(!t) return;
  platno.setPointerCapture(e.pointerId); platno.classList.add('vuce');
  vuce={x:e.clientX,y:e.clientY,px:t.pod.pomak_x,py:t.pod.pomak_y};
});
platno.addEventListener('pointermove', e=>{
  if(!vuce) return;
  const t=tekuca(); if(!t||!IZVOR.width) return;
  const g=geom(t);
  const slobX=VID.w-g.nw, slobY=VID.h-g.nh;        // predznak resava smer
  const dx=e.clientX-vuce.x, dy=e.clientY-vuce.y;
  t.pod.pomak_x = Math.abs(slobX)>1 ? ogr(vuce.px+dx/slobX) : 0.5;
  t.pod.pomak_y = Math.abs(slobY)>1 ? ogr(vuce.py+dy/slobY) : 0.5;
  crtajPlatno();
});
function krajVuce(){ if(!vuce) return; vuce=null; platno.classList.remove('vuce');
  posalji().then(osveziPrsten); }
platno.addEventListener('pointerup', krajVuce);
platno.addEventListener('pointercancel', krajVuce);
platno.addEventListener('wheel', e=>{
  const t=tekuca(); if(!t) return;
  e.preventDefault();
  const novi=ogr((t.pod.zum||1)*(e.deltaY<0?1.08:1/1.08), 0.25, 3);
  if(Math.abs(novi-(t.pod.zum||1))<1e-4) return;
  t.pod.zum=novi; postaviZum(novi);
  crtajPlatno(); posalji().then(osveziPrsten);
}, {passive:false});
platno.addEventListener('dblclick', ()=>{
  const t=tekuca(); if(!t) return;
  t.pod.zum=1; t.pod.pomak_x=0.5; t.pod.pomak_y=0.5;
  ucitajPod(); crtajPlatno(); posalji().then(osveziPrsten);
});
new ResizeObserver(()=>{ clearTimeout(tCrtanje); tCrtanje=setTimeout(crtajPlatno,60); })
  .observe(scena);

$$('[data-rot]').forEach(b=> b.onclick=async ()=>{

/* ============================================ podešavanja slike */
function postaviZum(v){
  $('#b-zum').value=Math.round(v*100);
  $('#v-zum').textContent=v.toFixed(2)+'×';
  $('#grupa-pozadine').hidden = v>=1;
}
function ucitajPod(){
  const t=tekuca(); if(!t) return;
  const p=t.pod;
  $('#b-crna').value=p.crna<0?0:p.crna;
  $('#b-bela').value=p.bela<0?255:p.bela;
  $('#b-zas').value=Math.round((p.zasicenje||1)*100);
  $('#b-jas').value=p.jasnoca;
  $('#b-jacina').value=p.jacina_preseta;
  $('#v-crna').textContent=p.crna<0?'auto':(+p.crna).toFixed(0);
  $('#v-bela').textContent=p.bela<0?'auto':(+p.bela).toFixed(0);
  $('#v-zas').textContent=(+p.zasicenje).toFixed(2);
  $('#v-jas').textContent=p.jasnoca;
  $('#v-jacina').textContent=p.jacina_preseta+' %';
  $('#grupa-jacine').hidden = (p.preset==='original');
  postaviZum(p.zum||1);
  $('#grupa-boje-popune').hidden=(p.popuna!=='boja');
  $('#boja-birac').value=p.boja_popune||'#FFFFFF';
  $('#boja-tekst').textContent=(p.boja_popune||'#FFFFFF').toUpperCase();
  $$('.plocica[data-preset]').forEach(x=>x.classList.toggle('aktivna', x.dataset.preset===p.preset));
  $$('.plocica[data-popuna]').forEach(x=>x.classList.toggle('aktivna', x.dataset.popuna===p.popuna));
  obelezi('#bojice', p.boja_popune);
  obelezi('#bojice-pozadine', p.boja_pozadine);
}
function posalji(){
  const t=tekuca(); if(!t) return Promise.resolve();
  clearTimeout(cekaj);
  return new Promise(res=>{
    cekaj=setTimeout(async ()=>{
      try{ await fetch('/api/podesi/'+t.id,{method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(t.pod)}); }
      catch(e){}
      res();
    }, 120);
  });
}
function pomeriBoju(){
  const t=tekuca(); if(!t) return;
  t.pod.crna=+$('#b-crna').value; t.pod.bela=+$('#b-bela').value;
  t.pod.zasicenje=(+$('#b-zas').value)/100; t.pod.jasnoca=+$('#b-jas').value;
  $('#v-crna').textContent=t.pod.crna.toFixed(0);
  $('#v-bela').textContent=t.pod.bela.toFixed(0);
  $('#v-zas').textContent=t.pod.zasicenje.toFixed(2);
  $('#v-jas').textContent=t.pod.jasnoca;
  osveziPosle();
}
['#b-crna','#b-bela','#b-zas','#b-jas'].forEach(s=> $(s).oninput=pomeriBoju);

  try{
    const h=await (await fetch('/health')).json();
    $('#oznaka-verzije').textContent=h.oznaka||h.app;
    const vb=$('#ver-box'); vb.querySelectorAll('.vv-row').forEach(e=>e.remove()); vv.section(vb, h.oznaka||h.app);
    const r=await (await fetch('/api/dnevnik?dana=1&koliko=1')).json();
    prikaziVelicinu(r);
  }catch(e){}
}
$('#zatvori-pod').onclick=()=> dij.close();
vv.init({storeKey:'kosnica-print'}); vv.startChecks($('#vv-bars'));

function napuniPodesavanja(){
  const d=PODACI.podesavanja, a=PODACI.app;
  RAM_INDEKS=d.izabrani_ram;
  crtajListuRamova();
  $$('.tema-dugme').forEach(b=> b.classList.toggle('aktivna', b.dataset.tema===a.tema));
  $('#p-biblioteka').value=a.biblioteka||'';
  $('#p-svi-papiri').checked=!!a.svi_papiri;
  $('#p-lenjir').checked=!!d.tabak.lenjir;
  const st=d.stampaci[d.izabrani_stampac];
  $('#k-faktor').value=(st.kalibracija/100).toFixed(4)+'  ('+st.kalibracija.toFixed(2)+' %)';
  $('#k-izmereno').value=d.tabak.lenjir_duzina||150;
  $('#poruka-rama').textContent='';
  povuciStampac();
}
function crtajListuRamova(){
  const l=$('#lista-ramova'); l.innerHTML='';
  PODACI.podesavanja.ramovi.forEach((r,i)=>{
    const b=document.createElement('button');
    b.className='ram-red'+(i===RAM_INDEKS?' izabran':'');
    const aktivan=(i===PODACI.podesavanja.izabrani_ram);
    b.innerHTML='<input type="checkbox" '+(aktivan?'checked':'')+' tabindex="-1">'
      +'<b>'+ucini(r.naziv)+'</b><span class="mono">'
      +r.prozor_s.toFixed(1)+'×'+r.prozor_v.toFixed(1)+'</span>';
    b.onclick=async ()=>{
      RAM_INDEKS=i;
      await fetch('/api/izaberi_ram/'+i,{method:'POST'});
      await povuci();
      crtajListuRamova(); napuniPoljaRama();
      IZVOR_ZA=null; ucitajIzvor(); osveziPrsten(); osveziPresete();
    };
    l.appendChild(b);
  });
  napuniPoljaRama();
}
function napuniPoljaRama(){
  const r=PODACI.podesavanja.ramovi[RAM_INDEKS];
  $('#naslov-rama').textContent = r ? 'Mere rama — '+r.naziv : 'Nov ram';
  $('#obrisi-ram').disabled = !r || PODACI.podesavanja.ramovi.length<=1;
  if(!r) return;
  $('#r-naziv').value=r.naziv; $('#r-ps').value=r.prozor_s; $('#r-pv').value=r.prozor_v;
  $('#r-rs').value=r.rez_s; $('#r-rv').value=r.rez_v;
  $('#r-nap').value=r.napust; $('#r-ostro').value=r.ostro;
}
function prazanObrazac(){
  RAM_INDEKS=-1;
  ['#r-naziv','#r-ps','#r-pv','#r-rs','#r-rv'].forEach(s=> $(s).value='');
  $('#r-nap').value=3; $('#r-ostro').value=1.5;
  $('#naslov-rama').textContent='Nov ram';
  $('#obrisi-ram').disabled=true;
  $$('.ram-red').forEach(x=>x.classList.remove('izabran'));
}
$('#nov-ram').onclick=()=>{ prazanObrazac(); $('#poruka-rama').textContent=''; $('#r-naziv').focus(); };
$('#sacuvaj-ram').onclick = async ()=>{
  const telo={indeks:RAM_INDEKS, naziv:$('#r-naziv').value,
    prozor_s:+$('#r-ps').value, prozor_v:+$('#r-pv').value,
    rez_s:+$('#r-rs').value, rez_v:+$('#r-rv').value,
    napust:+$('#r-nap').value, ostro:+$('#r-ostro').value, izaberi:true};
  const r=await (await fetch('/api/ram',{method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(telo)})).json();
  const p=$('#poruka-rama');
  if(!r.ok){ p.className='poruka lose'; p.textContent=r.poruka||'Nije sačuvano.'; return; }
  await povuci();
  p.className='poruka'; p.textContent='Sačuvano.';
  crtajListuRamova(); prazanObrazac();
  IZVOR_ZA=null; ucitajIzvor(); osveziPrsten();
};
$('#obrisi-ram').onclick = async ()=>{
  if(RAM_INDEKS<0) return;
  const r=PODACI.podesavanja.ramovi[RAM_INDEKS];
  if(!await potvrdi('Obrisati ram „'+r.naziv+'“?', 'Brisanje rama')) return;
  const o=await (await fetch('/api/ram/'+RAM_INDEKS,{method:'DELETE'})).json();
  const p=$('#poruka-rama');
  if(!o.ok){ p.className='poruka lose'; p.textContent=o.poruka||'Nije obrisano.'; return; }
  await povuci(); RAM_INDEKS=PODACI.podesavanja.izabrani_ram; crtajListuRamova();
};
$('#dugme-stl').onclick=()=> $('#stl-fajl').click();
$('#stl-fajl').onchange = async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const p=$('#poruka-rama'); p.className='poruka'; p.textContent='Merim model…';
  const fd=new FormData(); fd.append('fajl',f);
  let r;
  try{ r=await (await fetch('/api/stl',{method:'POST',body:fd})).json(); }
  catch(err){ p.className='poruka lose'; p.textContent='Merenje nije uspelo.'; return; }
  if(!r.ok){ p.className='poruka lose'; p.textContent=r.poruka||'Merenje nije uspelo.'; return; }
  const d=r.predlog;
  $('#r-ps').value=d.prozor[0]; $('#r-pv').value=d.prozor[1];
  $('#r-rs').value=d.rez[0];    $('#r-rv').value=d.rez[1];
  if(!$('#r-naziv').value) $('#r-naziv').value=f.name.replace(/\.stl$/i,'');
  p.className='poruka vazno';
  p.textContent='⚠ Izmeri dimenzije na odštampanom modelu i potvrdi ih ovde!';
};
$$('.tema-dugme').forEach(b=> b.onclick=()=>{
  $$('.tema-dugme').forEach(x=>x.classList.toggle('aktivna',x===b));
  document.documentElement.dataset.tema=b.dataset.tema;
  setTimeout(crtajPlatno,30);
});
$('#izaberi-fasciklu').onclick = async ()=>{
  const b=$('#izaberi-fasciklu'); b.disabled=true;
  try{
    const r=await (await fetch('/api/izaberi_fasciklu',{method:'POST'})).json();
    if(r.ok && r.putanja) $('#p-biblioteka').value=r.putanja;
    else if(r.poruka) poruka(r.poruka);
  }catch(e){}
  b.disabled=false;
};
$('#kal-stampaj').onclick = async ()=>{
  const b=$('#kal-stampaj'); b.disabled=true; b.textContent='Šaljem…';
  let r;
  try{ r=await (await fetch('/api/kontrolni_stampa',{method:'POST'})).json(); }
  catch(e){ r={ok:false,poruka:String(e)}; }
  b.disabled=false; b.textContent='Odštampaj kontrolni list';
  dij.close();
  poruka(r.ok ? 'Kontrolni list je poslat. Izmeri liniju šublerom.' : (r.poruka||'Nije uspelo.'),
         'Kalibracija');
};
$('#kal-upisi').onclick = async ()=>{
  const v=+$('#k-izmereno').value;
  if(!(v>50 && v<400)){ $('#poruka-rama').textContent='Unesi izmerenu dužinu u milimetrima.'; return; }
  await fetch('/api/kalibracija',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({izmereno:v})});
  await povuci(); napuniPodesavanja();
};
$('#sacuvaj-pod').onclick = async ()=>{
  await fetch('/api/app',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      tema:document.documentElement.dataset.tema,
      biblioteka:$('#p-biblioteka').value.trim()||null,
      svi_papiri:$('#p-svi-papiri').checked,
      lenjir:$('#p-lenjir').checked})});
  await povuci(); await crtajDrvo(); povuciStampac();
  dij.close();
};

/* ============================================ start */
(async ()=>{
  await povuci();
  crtajPresete();
  await crtajDrvo();
  povuciStampac();
  crtajRed();
})();
</script>
</body>
</html>
